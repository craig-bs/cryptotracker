services:
  web:
    build: .
    image: thedance/cryptotracker:latest
    volumes:
      - ./data:/usr/src/app/data
    ports:
      - "8000:8000"
    depends_on:
      - redis
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379
    labels:
      - "com.centurylinklabs.watchtower.enable=true"
      - "traefik.enable=true"
      - "traefik.http.routers.myapp.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.myapp.entrypoints=websecure"
      - "traefik.http.routers.myapp.tls.certresolver=letsencrypt"
      - "traefik.http.services.myapp.loadbalancer.server.port=8000"
    networks:
      - proxy

  celery:
    image: thedance/cryptotracker:latest
    command: celery -A dcp worker --loglevel=info
    volumes:
      - ./data:/usr/src/app/data
    depends_on:
      - redis
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  celery-beat:
    image: thedance/cryptotracker:latest
    command: celery -A dcp beat --loglevel=info
    volumes:
      - ./data:/usr/src/app/data
    depends_on:
      - redis
    env_file:
      - ./.env
    environment:
      - CELERY_BROKER_URL=redis://redis:6379/0
      - CELERY_RESULT_BACKEND=redis://redis:6379/0
      - REDIS_URL=redis://redis:6379
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  redis:
    image: redis:latest
    container_name: redis
    ports:
      - "6379:6379"

  # Proxy to redirect https to http at port 8000
  traefik:
    image: traefik:latest
    container_name: traefik
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./traefik.yml:/traefik.yml:ro
      - ./acme.json:/acme.json
      - ./dynamic.yml:/dynamic.yml:ro
    networks:
      - proxy
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.traefik.rule=Host(`${DOMAIN}`)"
      - "traefik.http.routers.traefik.service=api@internal"
      - "traefik.http.routers.traefik.tls.certresolver=letsencrypt"
      - "traefik.http.routers.traefik.entrypoints=websecure"
      - "traefik.http.routers.traefik.middlewares=auth@file"

#automatic update tool for running Docker containers
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --interval 1000 --cleanup --label-enable
    restart: unless-stopped

networks:
  proxy:
